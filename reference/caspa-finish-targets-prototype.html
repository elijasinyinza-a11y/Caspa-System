<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASPA™ prototype: finishing Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --navy:#0D1B2A; --text:#1A2B3C; --muted:#5E6B7A; --cream:#F5F4F0; --border:#D5D2CA; --control:#8A867D; --focus:#007F84; --line:#EDECEA;
  --panel:#223D56; --side-fg:#C8D1DB;
  --pf:#C2417A; --pf-t:#9B2C63; --ca:#7C5CBF; --ca-t:#4A2D8F; --ca-l:#F2EEF9;
  --blk:#B42318; --blk-l:#FEF3F2; --adv:#7A2E0E; --adv-l:#FFFAEB; --adv-b:#F5C26B; --ok:#067647; --ok-l:#ECFDF3; --ok-b:#ABEFC6; --info-l:#EDECEA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,input,textarea,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:28px;line-height:1.2;margin:0;color:var(--navy)}
h2{font-size:18px;margin:0;color:var(--navy)}
h3{font-size:16px;margin:0;color:var(--navy)}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .xs{font-size:12px}
.shell{display:flex;min-height:100vh}
.side{width:232px;flex:none;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px;font-weight:700}
.mark{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700}
.navbtn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:var(--side-fg);font-weight:500}
.navbtn.on{background:var(--panel);color:#fff}
.sub{padding-left:34px;font-size:13px;min-height:36px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:64px}
.crumbs{flex:1 1 260px;color:var(--muted);font-size:13px}
.crumbs b{color:var(--navy);font-weight:600}
.viewas{display:flex;align-items:center;gap:8px;border:1px dashed var(--control);border-radius:10px;padding:4px 4px 4px 10px;font-size:12px;color:var(--muted)}
.viewas select{min-height:36px;border:1px solid var(--control);border-radius:8px;padding:0 8px;background:#fff;color:var(--text);max-width:280px}
.content{padding:28px 32px 96px;max-width:1120px;width:100%;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--pf-t)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.lens{border-top:4px solid var(--pf)} .lens-ca{border-top:4px solid var(--ca)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--navy);color:#fff}
.btn-quiet{border-color:var(--control);font-weight:500}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--ok-l);color:var(--ok);border:1px solid var(--ok-b)}
.t-adv{background:var(--adv-l);color:var(--adv);border:1px solid var(--adv-b)}
.t-info{background:var(--info-l);color:var(--navy)}
.t-ca{background:var(--ca-l);color:var(--ca-t)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{min-height:44px;padding:0 14px;border:0;border-bottom:4px solid transparent;background:none;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.entries{display:flex;gap:8px;flex-wrap:wrap}
.entry{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:600;color:var(--text);display:inline-flex;align-items:center}
.entry.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.big{font-size:30px;font-weight:700;color:var(--navy)}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:12px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.list li:first-child{border-top:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--border)}
td{padding:8px;border-bottom:1px solid var(--line)} td.r,th.r{text-align:right}
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],textarea,select.in{width:100%;min-height:44px;padding:8px 10px;border-radius:8px;border:1px solid var(--control);background:#fff;color:var(--text)}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ca);background:var(--ca-l)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy)}
.check{border-radius:10px;padding:10px 12px;font-size:13px}
.c-adv{background:var(--adv-l);color:var(--adv);border:1px solid var(--adv-b)}
.c-blk{background:var(--blk-l);color:var(--blk);border:1px solid var(--blk)}
.c-ok{background:var(--ok-l);color:var(--ok);border:1px solid var(--ok-b)}
.note{background:var(--info-l);border-radius:10px;padding:12px 14px;font-size:13px}
.proto{border:1px dashed var(--control);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);background:#fff}
.drawer-bg{position:fixed;inset:0;background:rgba(13,27,42,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:21;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:90vw}
@media (max-width:760px){
  .side{display:none} .content{padding:18px 16px 110px} .top{padding:10px 16px} h1{font-size:22px} .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const one = (n) => (Math.round(n * 10) / 10).toFixed(1);

/* ═══ Framework text: the confirmed en.book lines and SIX_P_SCOPE ═══ */
const SIXP = [
  ['principle','Principle','Decisions that alter the four business variables, value, customers, capital and people, to set the overall direction of the business.','Value, customer, capital, people'],
  ['process','Process','Decisions within the specialised processes that bring capital and people together to generate value, such as production and revenue collection.','Technology, infrastructure'],
  ['people','People','Decisions on human resource matters. People are the primary drivers of process.','Organisational structure, people skills, behaviours and attitudes'],
  ['policy','Policy','Decisions made through policy frameworks, which provide consistency and standardisation in key decision areas.','Investment, labour, statutory, regulatory, industrial relations, asset management'],
  ['procedures','Procedure','Decisions on procedures, the link between processes and people, which align employees to process requirements for consistent results.','Standard operating procedures'],
  ['practices','Practices','Decisions on practices: habits individuals and teams have formed over time, which make up the culture of the organisation.','Organisational culture'],
];
const levelName = (k) => SIXP.find((x) => x[0] === k)?.[1] ?? '';

/* ═══ Illustrative records (the approved Targets prototype's example) ═══ */
const KPI = { code: 'K1.1.2', name: 'Billing efficiency', target: 80, partOf: 'G1 Improve financial sustainability › O1.1 Increase collection efficiency', owner: 'Joseph Tembo, Technical Manager' };
const ROLES = {
  ruth: { label: 'Ruth Banda, District Manager, East (share owner)', kind: 'owner' },
  joseph: { label: 'Joseph Tembo, Technical Manager (KPI owner; supervises the districts)', kind: 'supervisor' },
  bwalya: { label: 'Bwalya Musonda, Strategy office', kind: 'office' },
};
const ACTIVITIES = [
  { code: 'A1.1.2.1', title: 'Complete scheduled meter readings', owner: 'District Managers' },
  { code: 'A1.1.2.2', title: 'Replace faulty customer meters', owner: 'Head of Commercial' },
  { code: 'A1.1.2.3', title: 'Issue bills by the 5th of each month', owner: 'Billing Supervisor' },
];
const fresh = () => ({
  role: 'ruth', tab: 'share', drawer: null, toast: null,
  shares: [
    { id: 'n', unit: 'North District', owner: 'Grace Mwila', weight: 2.4, target: 78, readings: { Sep: [76, true], Oct: [77, true] } },
    { id: 's', unit: 'South District', owner: 'Brian Phiri', weight: 1.8, target: 82, readings: { Sep: [80, true], Oct: [81, true] } },
    { id: 'e', unit: 'East District', owner: 'Ruth Banda', weight: 1.2, target: 75, readings: { Sep: [70, true], Oct: [71, false] } },
    { id: 'w', unit: 'West District', owner: 'Agnes Lungu', weight: 0.9, target: 80, readings: { Sep: [79, true], Oct: [79, true] } },
    { id: 'c', unit: 'Central District', owner: 'Peter Sakala', weight: 3.0, target: 81, readings: { Sep: [79, true], Oct: [80, true] } },
  ],
  updates: [ { who: 'Mutale Zulu, Meter Reader, North', what: 'Complete scheduled meter readings', fig: '820 readings, October', done: false } ],
  deps: [ { on: 'A1.1.2.2 Replace faulty customer meters', owner: 'Head of Commercial', by: '2026-12-31', note: 'East’s faulty meters keep bills estimated.', inContract: false } ],
  proposals: [],
  nextCode: 4,
  returned: null,
});
let S = fresh();

/* ═══ TG-4: the latest period every share has verified, combined by weighted average ═══ */
function corporate() {
  for (const p of ['Oct', 'Sep']) {
    const all = S.shares.every((x) => x.readings[p] && x.readings[p][1]);
    if (all) {
      const w = S.shares.reduce((a, x) => a + x.weight, 0);
      return { period: p, value: S.shares.reduce((a, x) => a + x.weight * x.readings[p][0], 0) / w, reportedLatest: S.shares.filter((x) => x.readings.Oct?.[1]).length };
    }
  }
  return null;
}
const MONTH = { Sep: 'September', Oct: 'October' };

/* ═══ Rendering ═══ */
function render() {
  const r = ROLES[S.role];
  const tabs = r.kind === 'owner' ? [['share', 'My share'], ['kpi', 'The KPI']] : r.kind === 'supervisor' ? [['verify', 'To verify'], ['kpi', 'The KPI'], ['share', 'East’s share']] : [['needs', 'Needs you'], ['kpi', 'The KPI']];
  if (!tabs.some((t) => t[0] === S.tab)) S.tab = tabs[0][0];
  document.getElementById('app').innerHTML = `
  <div class="shell">
    <nav class="side" aria-label="Main"><div class="brand"><span class="mark">C</span>CASPA™</div><div>
      <div class="navbtn"><span class="dot" style="background:var(--side-fg)"></span>Home</div>
      <div class="navbtn"><span class="dot" style="background:#378ADD"></span>Strategy</div>
      <div class="navbtn"><span class="dot" style="background:var(--ca)"></span>Cascade</div>
      <div class="navbtn"><span class="dot" style="background:#B85C38"></span>Plan</div>
      <div class="navbtn on"><span class="dot" style="background:var(--pf)"></span>Performance</div>
      <div class="navbtn sub on">Targets</div></div></nav>
    <div class="main">
      <header class="top"><div class="crumbs">Performance › <b>Targets</b></div>
        <label class="viewas">Viewing as <select id="role">${Object.entries(ROLES).map(([k, v]) => `<option value="${k}" ${k === S.role ? 'selected' : ''}>${esc(v.label)}</option>`).join('')}</select></label></header>
      <main class="content">
        <p class="proto">Prototype for review: Finish Targets Specification v0.1 (TG-4, TG-9, To verify with shares, dependencies on shares). Illustrative districts and people; records reset on reload.</p>
        <div><span class="eyebrow">Performance · Controlling</span><h1>Targets</h1><p class="muted">Shares of corporate KPIs, the work behind them, and what they rely on.</p></div>
        <nav class="entries" aria-label="Performance"><span class="entry">Progress updates</span><span class="entry">Reviews</span><span class="entry on" aria-current="page">Targets</span><span class="entry">Contracts</span></nav>
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" aria-selected="${S.tab === k}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>
        ${S.tab === 'share' ? sharePage() : S.tab === 'kpi' ? kpiPage() : S.tab === 'verify' ? verifyPage() : needsPage()}
      </main>
    </div>
  </div>
  ${S.drawer ? drawer() : ''}
  ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  bind();
}

function kpiPage() {
  const c = corporate();
  const latestOct = S.shares.filter((x) => x.readings.Oct?.[1]).length;
  const progress = c ? (c.value - 70) / (KPI.target - 70) : null;
  return `<section class="card lens-ca" aria-labelledby="k-h">
    <p class="xs muted">${esc(KPI.partOf)}</p>
    <h2 id="k-h">${KPI.name} <span class="muted small">${KPI.code}</span></h2>
    <div class="row"><div><div class="big num">${c ? one(c.value) + '%' : 'No data'}</div><p class="small">Target ${KPI.target}% · owner ${esc(KPI.owner)}</p></div>
      ${c ? (() => { const r = progress / 0.79; const [l, k] = r >= 0.9 ? ['On track', 't-ok'] : r >= 0.7 ? ['At risk', 't-adv'] : ['Behind', 't-adv']; return `<span class="tag ${k}">${l}</span>`; })() : ''}</div>
    <p class="note">${c && c.period === 'Oct' ? `From shares: ${S.shares.length} of ${S.shares.length} reported for October.` : `From shares: ${latestOct} of ${S.shares.length} reported for October; showing September, the latest month every share has reported.`}
      Weighted average by water into supply. Only verified share readings count.</p>
    <p class="small muted">This KPI’s own readings are closed for FY2026: its figure comes from its five shares, so it is never typed in twice. Earlier readings stay in the record.</p>
    <div class="tablewrap"><table class="num"><thead><tr><th>Share</th><th class="r">Target</th><th class="r">September</th><th class="r">October</th></tr></thead><tbody>
      ${S.shares.map((x) => `<tr><td>${esc(x.unit)}</td><td class="r">${x.target}%</td><td class="r">${x.readings.Sep[0]}%</td><td class="r">${x.readings.Oct[1] ? x.readings.Oct[0] + '%' : `<span class="tag t-adv">Sent, not verified</span>`}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="xs muted">In Cascade, the KPI row shows the same figure with “From shares”.</p>
  </section>`;
}

function sharePage() {
  const sh = S.shares.find((x) => x.id === 'e');
  const owner = S.role === 'ruth';
  const canAct = owner || S.role === 'joseph';
  return `<section class="card lens" aria-labelledby="s-h">
    <p class="xs muted">Share of ${KPI.code} ${KPI.name}</p>
    <h2 id="s-h">East District</h2>
    <div class="row num"><span>Target <b>${sh.target}%</b></span><span>September <b>${sh.readings.Sep[0]}%</b> (verified)</span><span>October <b>${sh.readings.Oct[0]}%</b> ${sh.readings.Oct[1] ? '(verified)' : '<span class="tag t-adv">Waiting for Joseph Tembo to verify</span>'}</span></div>
    <p class="small muted">Owner: Ruth Banda, District Manager, East. Scored on its reading against its target.</p>
  </section>

  <section class="card" aria-labelledby="w-h">
    <h3 id="w-h">Work behind this share</h3>
    <p class="check c-adv"><b>Worth checking</b><br>No one’s work is linked to East District’s share. Link your team’s contract objectives, or propose new work if what is needed is not in Cascade.</p>
    ${S.proposals.length ? `<ul class="list">${S.proposals.map(proposalLine).join('')}</ul>` : ''}
    ${canAct ? `<div class="btns"><button class="btn btn-primary" data-act="propose">Propose new work</button></div><p class="xs muted">${owner ? 'For work Cascade does not have yet. The Strategy office confirms it into Cascade; then it goes into a contract like any other activity.' : 'You can propose on Ruth Banda’s behalf, as her supervisor.'}</p>` : ''}
  </section>

  <section class="card" aria-labelledby="d-h">
    <h3 id="d-h">This share depends on</h3>
    <ul class="list">${S.deps.map((d, i) => `<li><span><b>${esc(d.on)}</b><span class="xs muted" style="display:block">Owner: ${esc(d.owner)} · needed by ${fmtDate(d.by)}${d.note ? ' · ' + esc(d.note) : ''}</span>
      ${!d.inContract ? '<span class="check c-adv xs" style="display:inline-block;margin-top:6px"><b>Worth checking:</b> this work is in nobody’s contract yet.</span>' : ''}</span>
      ${canAct ? `<button class="btn btn-quiet" data-act="rm-dep" data-i="${i}">Remove<span style="position:absolute;left:-9999px">: ${esc(d.on)}</span></button>` : ''}</li>`).join('')}</ul>
    ${canAct ? `<div class="btns"><button class="btn" data-act="add-dep">Add what it depends on</button></div>` : ''}
    <p class="xs muted">Shown beside the affected objective at review, as evidence. A circle of dependencies is refused.</p>
  </section>`;
}
const fmtDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${['January','February','March','April','May','June','July','August','September','October','November','December'][m - 1]} ${y}`; };
function proposalLine(p) {
  const tag = p.outcome === 'waiting' ? '<span class="tag t-info">With the Strategy office</span>' : p.outcome === 'confirmed' ? `<span class="tag t-ok">Confirmed as ${p.code}</span>` : '<span class="tag t-adv">Returned</span>';
  return `<li><span><b>${esc(p.title)}</b><span class="xs muted" style="display:block">${levelName(p.level)} · ${esc(p.qty)} · proposed by ${esc(p.by)}</span>
    ${p.outcome === 'returned' ? `<span class="xs" style="display:block;margin-top:4px">Reason: ${esc(p.returnReason)}</span>` : ''}</span>
    <span class="btns">${tag}${p.outcome === 'returned' && S.role !== 'bwalya' ? `<button class="btn btn-quiet" data-act="resend" data-id="${p.id}">Change and send again</button><button class="btn btn-quiet" data-act="withdraw" data-id="${p.id}">Withdraw</button>` : ''}</span></li>`;
}

function verifyPage() {
  const e = S.shares.find((x) => x.id === 'e');
  const items = [];
  S.updates.filter((u) => !u.done).forEach((u, i) => items.push(`<li><span><span class="tag t-info">Contract</span> <b>${esc(u.who)}</b><span class="small" style="display:block">${esc(u.what)}: ${esc(u.fig)}</span></span><span class="btns"><button class="btn btn-primary" data-act="verify-u" data-i="${i}">Verify</button><button class="btn btn-quiet" data-act="return-x">Return</button></span></li>`));
  if (!e.readings.Oct[1]) items.push(`<li><span><span class="tag t-ca">Share of ${KPI.code}</span> <b>Ruth Banda, East District</b><span class="small" style="display:block">${KPI.name}: ${e.readings.Oct[0]}% for October (target ${e.target}%)</span></span><span class="btns"><button class="btn btn-primary" data-act="verify-s">Verify<span style="position:absolute;left:-9999px">: East District share</span></button><button class="btn btn-quiet" data-act="return-x">Return</button></span></li>`);
  return `<section class="card lens" aria-labelledby="v-h"><h2 id="v-h">To verify</h2>
    <p class="small muted">Progress your team has sent: contract objectives and shares of corporate KPIs, in one list. Only verified figures count.</p>
    ${items.length ? `<ul class="list">${items.join('')}</ul>` : '<p class="muted">Nothing to verify.</p>'}
  </section>`;
}

function needsPage() {
  const waiting = S.proposals.filter((p) => p.outcome === 'waiting');
  return `<section class="card lens" aria-labelledby="n-h"><h2 id="n-h">Needs you</h2>
    ${waiting.length ? `<ul class="list">${waiting.map((p) => `<li><span><span class="tag t-info">Approval</span> <b>Confirm new work for ${KPI.code}: ${esc(p.title)}</b><span class="xs muted" style="display:block">Proposed by ${esc(p.by)} for East District’s share</span></span><button class="btn btn-primary" data-act="review" data-id="${p.id}">Open</button></li>`).join('')}</ul>`
      : '<p class="muted">Nothing waiting. (Switch to Ruth Banda and propose new work.)</p>'}
    ${S.proposals.filter((p) => p.outcome !== 'waiting').length ? `<h3>Decided</h3><ul class="list">${S.proposals.filter((p) => p.outcome !== 'waiting').map(proposalLine).join('')}</ul>` : ''}
  </section>`;
}

function levelPicker(sel) {
  return `<fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px"><legend class="f">6P decision level (needed)</legend>
    ${SIXP.map(([k, n, line, scope]) => `<label class="opt"><input type="radio" name="lvl" value="${k}" ${sel === k ? 'checked' : ''}><span><b>${n}</b><span class="xs" style="display:block">${line}</span><span class="xs muted" style="display:block">Covers: ${scope}</span></span></label>`).join('')}</fieldset>`;
}
function drawer() {
  const d = S.drawer; let body = '';
  if (d.kind === 'propose' || d.kind === 'review') {
    const p = d.p;
    const review = d.kind === 'review';
    body = `<h2>${review ? 'Confirm new work into Cascade' : 'Propose new work'}</h2>
      <p class="small muted">Under ${KPI.code} ${KPI.name}, for East District’s share.${review ? ' You may correct it before confirming; the proposal keeps what was sent.' : ''}</p>
      <div><label class="f" for="pt">What the work is</label><input type="text" id="pt" value="${esc(p.title)}"></div>
      <div class="grid2"><div><label class="f" for="pq">Quantity (optional)</label><input type="text" id="pq" value="${esc(p.qty)}"></div>
        <div><label class="f" for="po">Owner</label><select class="in" id="po"><option ${p.owner === 'District Manager, East' ? 'selected' : ''}>District Manager, East</option><option ${p.owner === 'Billing Officer, East' ? 'selected' : ''}>Billing Officer, East</option></select></div></div>
      <div><label class="f" for="pm">Means of verification</label><input type="text" id="pm" value="${esc(p.mov)}"></div>
      <div><label class="f" for="pw">Why it is needed</label><textarea id="pw">${esc(p.why)}</textarea></div>
      ${levelPicker(p.level)}
      ${d.err ? `<p class="check c-blk" role="alert">${esc(d.err)}</p>` : ''}
      ${review ? `<div class="btns"><button class="btn btn-primary" data-act="confirm">Confirm into Cascade</button></div>
        <details><summary class="btn btn-quiet" style="display:inline-flex">Return with a reason</summary><label class="f" for="rr" style="margin-top:8px">Reason (needed)</label><textarea id="rr"></textarea><div class="btns" style="margin-top:8px"><button class="btn" data-act="do-return">Return to Ruth Banda</button></div></details>`
        : `<div class="btns"><button class="btn btn-primary" data-act="send">Send to the Strategy office</button><button class="btn btn-quiet" data-act="close">Cancel</button></div>`}`;
  }
  if (d.kind === 'dep') {
    body = `<h2>This share depends on</h2>
      <fieldset style="border:0;padding:0;margin:0"><legend class="f">Kind of work</legend>
        <label class="opt"><input type="radio" name="dk" value="act" checked><span><b>An activity in Cascade</b></span></label>
        <label class="opt" style="margin-top:6px"><input type="radio" name="dk" value="share"><span><b>Another district’s share</b></span></label></fieldset>
      <div><label class="f" for="don">Which</label><select class="in" id="don">
        <optgroup label="Activities">${ACTIVITIES.map((a) => `<option value="A|${a.code} ${a.title}|${a.owner}">${a.code} ${a.title} (${a.owner})</option>`).join('')}</optgroup>
        <optgroup label="Shares">${S.shares.filter((x) => x.id !== 'e').map((x) => `<option value="S|${x.unit}’s share of ${KPI.code}|${x.owner}">${x.unit} (${x.owner})</option>`).join('')}</optgroup></select></div>
      <div class="grid2"><div><label class="f" for="dby">Needed by</label><input type="date" id="dby" value="2026-12-31"></div><div></div></div>
      <div><label class="f" for="dno">Note</label><input type="text" id="dno" placeholder="What East needs from it"></div>
      <div class="btns"><button class="btn btn-primary" data-act="save-dep">Add</button><button class="btn btn-quiet" data-act="close">Cancel</button></div>`;
  }
  return `<div class="drawer-bg" data-act="close"></div><div class="drawer" role="dialog" aria-modal="true" aria-label="Details">${body}</div>`;
}

/* ═══ Actions ═══ */
const say = (t) => { S.toast = t; setTimeout(() => { S.toast = null; render(); }, 2600); };
const readForm = (p) => ({ ...p, title: document.getElementById('pt').value.trim(), qty: document.getElementById('pq').value.trim(), owner: document.getElementById('po').value, mov: document.getElementById('pm').value.trim(), why: document.getElementById('pw').value.trim(), level: document.querySelector('input[name=lvl]:checked')?.value ?? null });
function act(a, el) {
  if (a === 'tab') S.tab = el.dataset.tab;
  if (a === 'close') S.drawer = null;
  if (a === 'propose') S.drawer = { kind: 'propose', p: { title: 'Run a monthly billing-exception clinic in East District', qty: '12 clinics', owner: 'District Manager, East', mov: 'Clinic registers and the exceptions log', why: 'Exceptions stay open past 10 days; East has no routine to clear them.', level: null } };
  if (a === 'send') {
    const p = readForm(S.drawer.p);
    if (!p.title || !p.level) { S.drawer = { ...S.drawer, p, err: !p.level ? 'Choose a 6P decision level.' : 'Say what the work is.' }; }
    else { S.proposals.push({ ...p, id: 'p' + (S.proposals.length + 1), outcome: 'waiting', by: S.role === 'ruth' ? 'Ruth Banda' : 'Joseph Tembo (for Ruth Banda)', sent: { ...p } }); S.drawer = null; say('Sent to the Strategy office.'); }
  }
  if (a === 'review') { const p = S.proposals.find((x) => x.id === el.dataset.id); S.drawer = { kind: 'review', p, id: p.id }; }
  if (a === 'confirm') {
    const p = readForm(S.drawer.p);
    if (!p.level) S.drawer = { ...S.drawer, p, err: 'Choose a 6P decision level.' };
    else { const x = S.proposals.find((y) => y.id === S.drawer.id); Object.assign(x, p, { outcome: 'confirmed', code: `A1.1.2.${S.nextCode++}` }); ACTIVITIES.push({ code: x.code, title: x.title, owner: x.owner }); S.drawer = null; say(`Confirmed as ${x.code}. It is in Cascade under ${KPI.code}; Ruth Banda is told.`); }
  }
  if (a === 'do-return') {
    const t = document.getElementById('rr').value.trim();
    if (!t) S.drawer = { ...S.drawer, err: 'Give a reason.' };
    else { const x = S.proposals.find((y) => y.id === S.drawer.id); x.outcome = 'returned'; x.returnReason = t; S.drawer = null; say('Returned to Ruth Banda.'); }
  }
  if (a === 'resend') { const x = S.proposals.find((y) => y.id === el.dataset.id); S.drawer = { kind: 'propose', p: { ...x }, resend: x.id }; S.proposals = S.proposals.filter((y) => y.id !== x.id); }
  if (a === 'withdraw') { const x = S.proposals.find((y) => y.id === el.dataset.id); x.outcome = 'withdrawn'; S.proposals = S.proposals.filter((y) => y.id !== x.id); say('Withdrawn.'); }
  if (a === 'add-dep') S.drawer = { kind: 'dep' };
  if (a === 'save-dep') { const [k, on, owner] = document.getElementById('don').value.split('|'); S.deps.push({ on, owner, by: document.getElementById('dby').value, note: document.getElementById('dno').value.trim(), inContract: k === 'S' }); S.drawer = null; say('Added.'); }
  if (a === 'rm-dep') { S.deps.splice(Number(el.dataset.i), 1); say('Removed.'); }
  if (a === 'verify-u') { S.updates[Number(el.dataset.i)].done = true; say('Verified.'); }
  if (a === 'verify-s') { S.shares.find((x) => x.id === 'e').readings.Oct[1] = true; say('Verified. Every district has reported October, so the KPI now shows October.'); }
  if (a === 'return-x') say('In the build, Return asks for a reason, as today.');
  render();
  const f = document.querySelector('.drawer input, .drawer select'); if (S.drawer && f) f.focus();
}
function bind() {
  document.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', (e) => { if (el.tagName !== 'SUMMARY') e.preventDefault(); act(el.dataset.act, el); }));
  document.getElementById('role').addEventListener('change', (e) => { S.role = e.target.value; S.drawer = null; render(); });
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.drawer) { S.drawer = null; render(); } });
render();
</script>
</body>
</html>
