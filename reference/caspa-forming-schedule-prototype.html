<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASPA™ prototype: forming schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#0D1B2A;--text:#1A2B3C;--muted:#5E6B7A;--cream:#F5F4F0;--border:#D5D2CA;--control:#8A867D;--focus:#007F84;--line:#EDECEA;
  --st:#378ADD;--st-t:#1A5A9E;--st-l:#EBF3FC;--ok:#067647;--ok-l:#ECFDF3;--ok-b:#ABEFC6;--adv:#7A2E0E;--adv-l:#FFFAEB;--adv-b:#F5C26B;--blk:#B42318;--blk-l:#FEF3F2;--info:#EDECEA;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:28px;margin:0;color:var(--navy);line-height:1.2} h2{font-size:18px;margin:0;color:var(--navy)} h3{font-size:13px;margin:0;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 96px;display:flex;flex-direction:column;gap:16px}
.proto{border:1px dashed var(--control);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);background:#fff;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;font-weight:600;color:var(--st-t)}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.strip{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:600;color:var(--navy);cursor:pointer}
.chip[aria-expanded="true"]{border-color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--control);flex:none}
.dot.open{background:var(--st);border-color:var(--st)} .dot.closed{background:var(--navy);border-color:var(--navy)}
.chip .s{font-weight:500;color:var(--muted);font-size:13px}
.panel{margin-top:10px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:600;cursor:pointer}
.btn-primary{background:var(--navy);color:#fff} .btn-quiet{border-color:var(--control);font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.month{margin-top:6px}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.month .item:first-of-type{border-top:0}
.date{text-align:center;border-radius:10px;background:var(--cream);padding:6px 0}
.date b{display:block;font-size:20px;color:var(--navy);line-height:1.1} .date span{font-size:12px;color:var(--muted)}
.t{font-weight:600;color:var(--navy)}
.meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap}
.t-stage{background:var(--st-l);color:var(--st-t)} .t-kind{background:var(--info);color:var(--navy)}
.t-ok{background:var(--ok-l);color:var(--ok);border:1px solid var(--ok-b)} .t-adv{background:var(--adv-l);color:var(--adv);border:1px solid var(--adv-b)} .t-blk{background:var(--blk-l);color:var(--blk);border:1px solid var(--blk)} .t-due{background:var(--info);color:var(--navy)}
.gate{border-left:4px solid var(--navy);padding-left:10px}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:end;margin-top:10px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:4px}
input,select{width:100%;min-height:44px;border:1px solid var(--control);border-radius:8px;padding:0 10px;background:#fff;color:var(--text)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;max-width:90vw}
@media (max-width:640px){ .item{grid-template-columns:56px minmax(0,1fr)} .item .right{grid-column:2} .form{grid-template-columns:1fr 1fr} .form .wide{grid-column:1 / -1} h1{font-size:22px} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
'use strict';
const TODAY = '2026-10-18';
const STAGES = ['Conception', 'Consultation', 'Confirmation', 'Composition', 'Communication'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

/* The usual sequence, offered once and then the Strategy office's own: plain, generic names; no framework text. */
const STARTER = [
  ['milestone', 'Department sheets due', 'Conception'], ['meeting', '4Q review session', 'Conception'],
  ['meeting', 'Consultation with staff and stakeholders', 'Consultation'], ['milestone', 'Consultation closes', 'Consultation'],
  ['gate', 'Vision confirmation', 'Confirmation'], ['meeting', 'Composition workshop', 'Composition'],
  ['gate', 'Plan confirmation', 'Composition'], ['meeting', 'Board meeting: plan approval', 'Composition'],
  ['meeting', 'Plan launch to staff', 'Communication'],
];
const sample = () => ({
  stages: { Conception: 'open', Consultation: 'not_started', Confirmation: 'not_started', Composition: 'not_started', Communication: 'not_started' },
  open: null, adding: false, toast: null,
  items: [
    { id: 1, kind: 'meeting', title: 'Leadership briefing on the 4Q review', stage: 'Conception', date: '2026-10-09', owner: 'Strategy office', done: true },
    { id: 2, kind: 'milestone', title: 'Department sheets due', stage: 'Conception', date: '2026-10-23', owner: 'Department heads', done: false },
    { id: 3, kind: 'meeting', title: '4Q review session', stage: 'Conception', date: '2026-11-04', owner: 'Strategy office', done: false },
    { id: 4, kind: 'meeting', title: 'Consultation with staff and stakeholders', stage: 'Consultation', date: '2026-11-12', owner: 'Strategy office', done: false },
    { id: 5, kind: 'milestone', title: 'Consultation closes', stage: 'Consultation', date: '2026-11-20', owner: 'Strategy office', done: false },
    { id: 6, kind: 'gate', title: 'Vision confirmation', stage: 'Confirmation', date: '2026-11-30', owner: 'Executive', done: false },
    { id: 7, kind: 'meeting', title: 'Composition workshop', stage: 'Composition', date: '2027-01-14', owner: 'Strategy office', done: false },
    { id: 8, kind: 'gate', title: 'Plan confirmation', stage: 'Composition', date: '2027-01-29', owner: 'Executive', done: false },
    { id: 9, kind: 'meeting', title: 'Board meeting: plan approval', stage: 'Composition', date: '2027-02-26', owner: 'Board secretary', done: false },
    { id: 10, kind: 'meeting', title: 'Department briefings on the new plan', stage: 'Communication', date: null, owner: 'Department heads', done: false },
  ],
});
let S = sample(); let next = 100;

const KIND = { meeting: 'Meeting', milestone: 'Milestone', gate: 'Confirmation' };
function status(it) {
  if (it.done) return ['Done', 't-ok'];
  if (!it.date) return ['', ''];
  const d = days(TODAY, it.date);
  if (d < 0) return ['Overdue', 't-blk'];
  if (d <= 7) return [d === 0 ? 'Today' : `In ${d} day${d === 1 ? '' : 's'}`, 't-adv'];
  return ['', ''];
}
function itemHtml(it) {
  const [st, cls] = status(it);
  const [y, m, d] = it.date ? it.date.split('-').map(Number) : [];
  return `<div class="item ${it.kind === 'gate' ? 'gate' : ''}">
    ${it.date ? `<div class="date num"><b>${d}</b><span>${MONTHS[m - 1].slice(0, 3)}</span></div>` : `<div class="date"><span>No date</span></div>`}
    <div><p class="t">${esc(it.title)}</p><p class="meta"><span class="tag t-stage">${it.stage}</span><span class="tag t-kind">${KIND[it.kind]}</span>${it.kind === 'gate' ? '<span>Enforced: its checks must pass</span>' : ''}<span>${esc(it.owner)}</span></p></div>
    <div class="right row">${st ? `<span class="tag ${cls}">${st}</span>` : ''}
      ${!it.date ? `<label class="f" style="margin:0" for="d${it.id}"><span style="position:absolute;left:-9999px">Date for ${esc(it.title)}</span></label><input type="date" id="d${it.id}" data-date="${it.id}" style="width:160px">`
        : !it.done && it.kind !== 'gate' && it.date <= TODAY ? `<button class="btn btn-quiet" data-act="done" data-id="${it.id}">Mark done<span style="position:absolute;left:-9999px">: ${esc(it.title)}</span></button>` : ''}</div>
  </div>`;
}
function render() {
  const dated = S.items.filter((i) => i.date).sort((a, b) => (a.date < b.date ? -1 : 1));
  const undated = S.items.filter((i) => !i.date);
  const groups = {};
  for (const it of dated) { const [y, m] = it.date.split('-'); (groups[`${y}-${m}`] ||= []).push(it); }
  const nextUp = dated.find((i) => !i.done && i.date >= TODAY);
  document.getElementById('app').innerHTML = `
    <div class="proto"><span>Lean prototype: Strategy › Forming the next plan, as a schedule. Sample Water Utility, today ${dateTxt(TODAY)}.</span>
      <span class="row"><button class="btn btn-quiet" data-act="new">Show a plan with nothing scheduled</button><button class="btn btn-quiet" data-act="reset">Back to the sample</button></span></div>
    <div><span class="eyebrow">Strategy · Conception to Communication</span><h1>Strategic Plan 2027–2031</h1>
      <p class="muted">${nextUp ? `Next: <b>${esc(nextUp.title)}</b>, ${dateTxt(nextUp.date)}.` : 'Nothing coming up.'}</p></div>

    <section class="card" aria-labelledby="st-h">
      <div class="row"><h3 id="st-h">Stages</h3><span class="small muted">They may overlap. Only the two confirmations are enforced.</span></div>
      <div class="strip" style="margin-top:8px">${STAGES.map((s) => `<button class="chip" aria-expanded="${S.open === s}" data-act="stage" data-s="${s}"><span class="dot ${S.stages[s] === 'open' ? 'open' : S.stages[s] === 'closed' ? 'closed' : ''}"></span>${s} <span class="s">${S.stages[s] === 'open' ? 'Open' : S.stages[s] === 'closed' ? 'Closed' : 'Not started'}</span></button>`).join('')}</div>
      ${S.open ? `<div class="panel"><span class="small">${S.open}: ${S.items.filter((i) => i.stage === S.open).length} items in the schedule. ${S.stages[S.open] === 'open' ? 'Open now.' : S.stages[S.open] === 'closed' ? 'Closed.' : 'Not started.'}</span>
        <span class="row">${S.stages[S.open] !== 'open' ? `<button class="btn btn-primary" data-act="setstage" data-v="open">${S.stages[S.open] === 'closed' ? 'Reopen' : 'Open'} ${S.open}</button>` : `<button class="btn" data-act="setstage" data-v="closed">Close ${S.open}</button>`}</span></div>` : ''}
    </section>

    <section class="card" aria-labelledby="sc-h">
      <div class="row"><h3 id="sc-h">Schedule</h3>${S.items.length ? `<button class="btn" data-act="add">Add a meeting or milestone</button>` : ''}</div>
      ${S.adding ? addForm() : ''}
      ${!S.items.length ? `<div class="empty"><p><b>Nothing scheduled yet.</b></p><p class="small muted">Start from the usual sequence: one or two meetings or milestones per stage and the two confirmations. Set the dates, remove what you don’t need.</p><button class="btn btn-primary" data-act="build">Build the schedule</button></div>` : ''}
      ${Object.entries(groups).map(([k, list]) => { const [y, m] = k.split('-'); return `<div class="month"><h2 style="font-size:16px;margin-top:10px">${MONTHS[Number(m) - 1]} ${y}</h2>${list.map(itemHtml).join('')}</div>`; }).join('')}
      ${undated.length ? `<div class="month"><h2 style="font-size:16px;margin-top:10px">Not yet scheduled (${undated.length})</h2>${undated.map(itemHtml).join('')}</div>` : ''}
    </section>
    ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}`;
  bind();
}
const dateTxt = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
function addForm() {
  return `<div class="form">
    <div class="wide"><label class="f" for="nt">What</label><input id="nt" placeholder="For example: Meeting with the regulator"></div>
    <div><label class="f" for="nk">Kind</label><select id="nk"><option value="meeting">Meeting</option><option value="milestone">Milestone</option></select></div>
    <div><label class="f" for="ns">Stage</label><select id="ns">${STAGES.map((s) => `<option>${s}</option>`).join('')}</select></div>
    <div><label class="f" for="nd">Date (optional)</label><input type="date" id="nd"></div>
    <div class="wide"><label class="f" for="no">Owner</label><input id="no" value="Strategy office"></div>
    <div class="row wide"><button class="btn btn-primary" data-act="save">Add to the schedule</button><button class="btn btn-quiet" data-act="cancel">Cancel</button></div></div>`;
}
const say = (t) => { S.toast = t; setTimeout(() => { S.toast = null; render(); }, 2400); };
function act(a, el) {
  if (a === 'stage') S.open = S.open === el.dataset.s ? null : el.dataset.s;
  if (a === 'setstage') { S.stages[S.open] = el.dataset.v; say(`${S.open} ${el.dataset.v === 'open' ? 'opened' : 'closed'}.`); }
  if (a === 'add') S.adding = !S.adding;
  if (a === 'cancel') S.adding = false;
  if (a === 'save') { const t = document.getElementById('nt').value.trim(); if (!t) return; S.items.push({ id: next++, kind: document.getElementById('nk').value, title: t, stage: document.getElementById('ns').value, date: document.getElementById('nd').value || null, owner: document.getElementById('no').value.trim() || 'Strategy office', done: false }); S.adding = false; say('Added.'); }
  if (a === 'done') { S.items.find((i) => i.id === Number(el.dataset.id)).done = true; say('Marked done.'); }
  if (a === 'new') { S = { ...sample(), items: [], stages: Object.fromEntries(STAGES.map((s) => [s, 'not_started'])) }; }
  if (a === 'reset') S = sample();
  if (a === 'build') { S.items = STARTER.map(([kind, title, stage]) => ({ id: next++, kind, title, stage, date: null, owner: kind === 'gate' ? 'Executive' : 'Strategy office', done: false })); say('Usual sequence added. Set the dates.'); }
  render();
}
function bind() {
  document.querySelectorAll('[data-act]').forEach((el) => el.addEventListener('click', () => act(el.dataset.act, el)));
  document.querySelectorAll('[data-date]').forEach((el) => el.addEventListener('change', () => { S.items.find((i) => i.id === Number(el.dataset.date)).date = el.value; say('Date set.'); render(); }));
}
render();
</script>
</body>
</html>
