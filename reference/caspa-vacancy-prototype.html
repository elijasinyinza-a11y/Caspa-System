<style>
/* Approved tokens only (BUILD-BRIEF section 5). Light mode only. */
:root{--navy:#0D1B2A;--text:#1A2B3C;--muted:#5E6B7A;--cream:#F5F4F0;--white:#FFFFFF;--border:#D5D2CA;--control:#8A867D;--focus:#007F84;

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--cream);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{display:flex;height:100%}
.side{width:232px;background:var(--navy);color:var(--white);display:flex;flex-direction:column;padding:16px 12px;gap:4px;flex-shrink:0}
.brand{font-size:18px;font-weight:700;padding:4px 10px 16px}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:8px;color:var(--white);text-decoration:none;font-weight:500}
.nav a[aria-current=page]{background:rgba(255,255,255,.15)}
.nav a:hover{background:rgba(255,255,255,.08)}
.mark{width:4px;height:18px;border-radius:2px;background:rgba(255,255,255,.35)}
.sep{height:1px;background:rgba(255,255,255,.2);margin:10px 4px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{background:var(--white);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:8px 20px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--muted);flex:1;min-width:160px}
.crumb b{color:var(--navy)}
.proto{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=email],input[type=date],input[type=number],textarea{min-height:44px;border:1px solid var(--control);border-radius:8px;padding:8px 10px;background:var(--white)}
textarea{width:100%;min-height:72px}
.scroll{flex:1;overflow-y:auto;padding:20px 24px 60px}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:28px;color:var(--navy);margin:0 0 4px}
h2{font-size:18px;color:var(--navy);margin:0 0 8px}
h3{font-size:16px;color:var(--navy);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}.xs{font-size:12px}
.purpose{font-size:16px;margin:0 0 6px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--navy);background:var(--white);color:var(--navy);font-weight:600;cursor:pointer}
.btn.primary{background:var(--navy);color:var(--white)}
.btn.link{border:none;background:none;padding:0 4px;text-decoration:underline;min-height:44px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0;flex-wrap:wrap}
.tabs button{min-height:44px;border:none;background:none;padding:0 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;border:1px solid var(--border);background:var(--info-b);color:var(--navy)}
.chip.blk{color:var(--blk-t);background:var(--blk-b);border-color:var(--blk-t)}
.chip.adv{color:var(--adv-t);background:var(--adv-b);border-color:var(--adv-r)}
.chip.ok{color:var(--ok-t);background:var(--ok-b);border-color:var(--ok-r)}
.chk{border-radius:10px;padding:12px;margin:8px 0;border:1px solid}
.chk.blk{border:2px solid var(--blk-t);background:var(--blk-b)}
.chk.adv{border-color:var(--adv-r);background:var(--adv-b)}
.chk.done{border-color:var(--border);background:var(--white)}
.chk .lbl{font-weight:700;font-size:13px}
.chk.blk .lbl{color:var(--blk-t)}.chk.adv .lbl{color:var(--adv-t)}
.banner{border-radius:10px;padding:12px 14px;margin:12px 0;border:1px solid var(--border);background:var(--info-b)}
.banner.ok{background:var(--ok-b);border-color:var(--ok-r);color:var(--ok-t)}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:18px;border-left:1px solid var(--border);margin-left:8px}
.unit{padding:10px 0 4px}
.uname{font-weight:700;color:var(--navy)}
.pos{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--white)}
.pos .t{font-weight:600}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
th{color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600}
.dlg{position:fixed;inset:0;background:rgba(13,27,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg .card{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.ai{font-size:12px;font-weight:700;color:var(--navy);background:var(--info-b);border:1px dashed var(--control);border-radius:6px;padding:1px 6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.help{border-left:3px solid var(--navy);padding:8px 12px;background:var(--white);margin:8px 0;border-radius:0 8px 8px 0}
.bottom{display:none}
@media (max-width:760px){
 .side{display:none}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--navy);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
 .bottom a{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--white);text-decoration:none;font-size:12px;font-weight:600}

 .grid2,.grid3{grid-template-columns:1fr}
 .scroll{padding:16px 14px 90px}

.vrow{border:1px solid var(--border);border-radius:10px;background:var(--white);margin:8px 0}
.vrow>.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px;flex-wrap:wrap}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

.stops{margin:6px 0 0;font-size:14px}
.detail{border-top:1px solid var(--border);padding:12px}
.hold h3{margin-top:14px}
.hold ul{margin:4px 0 0;padding-left:18px}
@media print{.side,.top,.bottom,.noprint{display:none!important}.scroll{overflow:visible}}

};

const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n = (x) => x.toLocaleString('en-GB');
const date = (iso) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const dayAfter = (iso) => new Date(Date.parse(iso + 'T00:00:00Z') + 864e5).toISOString().slice(0, 10);
const plural = (k, one, many) => `${n(k)} ${k === 1 ? one : many}`;

/* H4: who sees the vacancy view, and which positions. Managers see the units they answer for, and below. */
function unitsBelow(unitName) {
  const top = D.units.find(u => u.name === unitName); if (!top) return [];
  const out = [top.id]; for (let i = 0; i < out.length; i++) D.units.filter(u => u.parent === out[i]).forEach(u => out.push(u.id)); return out;
}
function vacancyScope() {
  if (oversight()) return 'all';
  const units = myPositions().flatMap(p => P[p].answersFor.flatMap(unitsBelow));
  return units.length ? new Set(units) : null;
}
/* H5: who may open a handover list. */
function canHandover(pid) {
  if (has('org_admin') || has('hr')) return true;
  const mine = myPositions();
  return mine.includes(pid) || mine.includes(P[pid].reportsTo);
}
/* Section 6: amounts for the Executive, Finance and the line's budget holders; contract names for HR and the supervisor. */
const seesAmounts = (pid) => has('executive') || has('finance') || myPositions().some(m => m === pid || P[pid].managers.includes(m));
const seesContractNames = (pid) => has('hr') || myPositions().includes(pid);
const seesCheckText = () => has('executive') || has('strategy_office') || has('org_admin');

const state = (pid) => { const h = S.holders[pid]; return !h ? 'vacant' : h.acting ? 'acting' : 'held'; };
function needsSupervisor(p) { return p.contracts.filter(c => c.openReview || c.status === 'draft' || c.unverified > 0); }
/* H1: what stops soonest first. Contracts that need a supervisor, then budget lines, then must-fix records, then other records. */
function rank(p) {
  const recs = p.owned.length;
  return [needsSupervisor(p).length ? 0 : 1, p.lines.length ? 0 : 1, p.owned.some(o => o.mustFix) || p.checks.some(c => c.must) ? 0 : 1, -(recs + p.lines.length + p.contracts.length), p.title];
}
const cmp = (a, b) => { for (let i = 0; i < a.length; i++) { if (a[i] < b[i]) return -1; if (a[i] > b[i]) return 1; } return 0; };
function stops(p) {
  const out = [];
  const ns = needsSupervisor(p);
  if (ns.length) {
    const parts = [];
    if (ns.some(c => c.openReview)) parts.push('reviews can’t be completed');
    if (ns.some(c => c.status === 'draft')) parts.push('contracts can’t be issued');
    if (ns.some(c => c.unverified)) parts.push('progress can’t be verified');
    out.push(`${plural(ns.length, 'contract has', 'contracts have')} no supervisor: ${parts.join(' and ')}.`);
  }
  if (p.lines.length) out.push(`${plural(p.lines.length, 'budget line has', 'budget lines have')} no holder in post; Finance and the managers above can still act.`);
  if (p.owned.length) out.push(`${plural(p.owned.length, 'record has', 'records have')} no owner in post.`);
  if (p.checks.length) out.push(`${plural(p.checks.length, 'check is', 'checks are')} sent to an empty post.`);
  return out.length ? out.join(' ') : 'Nothing stops: the position owns nothing and supervises no contracts.';
}

function listed() {
  const scope = vacancyScope(); if (!scope) return null;
  return D.positions.filter(p => state(p.id) !== 'held' && (scope === 'all' || scope.has(p.unitId)))
    .sort((a, b) => (state(a.id) === state(b.id) ? cmp(rank(a), rank(b)) : state(a.id) === 'vacant' ? -1 : 1));
}

    const name = $('#hn').value.trim();
    const p2 = P[pid];
    const what = [p2.owned.length && plural(p2.owned.length, 'owned record', 'owned records'), p2.lines.length && plural(p2.lines.length, 'budget line', 'budget lines'), p2.contracts.length && plural(p2.contracts.length, 'supervised contract', 'supervised contracts'), p2.reports.length && plural(p2.reports.length, 'direct report', 'direct reports')].filter(Boolean);
    const list = what.length ? what.join(', ') : 'nothing';
    $('#passes').innerHTML = name && name !== h?.name ? `<b>What passes to the new holder:</b> ${esc(list)}. ${h ? esc(h.name) + '’s roles stay with them unless you change them.' : ''}`
      : !name ? `<b>What the vacant position keeps:</b> ${esc(list)}. ${needsSupervisor(p2).length ? 'While it is vacant, ' + stops(p2).split('.')[0].toLowerCase() + '.' : ''}` : `<b>No change of holder.</b>`;
  };
  upd(); $('#hn').oninput = upd; $('#hn').focus();
  $('#cancel').onclick = () => { $('#dlg').innerHTML = ''; };
  $('#save').onclick = () => {
    const name = $('#hn').value.trim(), acting = $('#ha').checked;
    if (!name) { if (h) S.lastEnded[pid] = new Date(Date.parse(D.now + 'T00:00:00Z') - 864e5).toISOString().slice(0, 10); delete S.holders[pid]; S.note = `${p.title} is vacant from today. The change is recorded.`; }
    else { S.holders[pid] = { person: h && h.name === name ? h.person : 'p-new', name, acting, since: D.now }; S.note = `${p.title}: ${name}${acting ? ' (acting)' : ''} from today. The change is recorded.`; }
    $('#dlg').innerHTML = ''; render();
  };
  $('#dlg').onkeydown = (e) => { if (e.key === 'Escape') $('#dlg').innerHTML = ''; };
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-open],[data-edit],[data-ai],[data-download]'); if (!t) return;
  e.preventDefault();
  if (t.dataset.go) { S.note = null; if (t.dataset.go.startsWith('handover:')) S.prev = S.view; S.view = t.dataset.go; S.ai = null; render(); $('#main').focus(); }
  if (t.dataset.open) { S.open.has(t.dataset.open) ? S.open.delete(t.dataset.open) : S.open.add(t.dataset.open); render(); }
  if (t.dataset.edit) editDialog(t.dataset.edit);
  if (t.dataset.ai) { S.ai = t.dataset.ai; render(); }
  if (t.dataset.download) { S.note = 'In the product this downloads a spreadsheet.'; render(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'vfind') { S.find = e.target.value; const pos = e.target.selectionStart; render(); const f = $('#vfind'); f.focus(); f.setSelectionRange(pos, pos); } });
$('#role').onchange = (e) => { S.role = e.target.value; S.note = null; if (S.view === 'vac' && !listed()) S.view = 'org'; render(); };
$('#reset').onclick = () => { S = fresh(); $('#role').value = 'executive'; render(); };
render();
</script></body></html>
